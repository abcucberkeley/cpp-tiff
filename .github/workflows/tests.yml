name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-python:
    name: C++ and Python (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-24.04, shell: bash,        generator: Unix Makefiles }
          - { name: macOS,   os: macos-15,     shell: bash,        generator: Unix Makefiles }
          - { name: Windows, os: windows-2025, shell: 'msys2 {0}', generator: Ninja }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      # The library's build flags and OpenMP setup are GCC-only, so Windows uses
      # MinGW. Python comes from MSYS2 too, so everything shares one toolchain.
      # MSYS2 packages GCC's OpenMP runtime (libgomp) separately from gcc.
      - name: Set up MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          pacboy: gcc:p libgomp:p cmake:p ninja:p python:p python-numpy:p pybind11:p

      # Same compiler as the release builds. Apple clang has no OpenMP.
      - name: Set up GCC 13 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list gcc@13 > /dev/null 2>&1 || brew install gcc@13
          echo "CC=$(brew --prefix gcc@13)/bin/gcc-13" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix gcc@13)/bin/g++-13" >> "$GITHUB_ENV"

      - name: Set up Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build library and C++ tests
        run: |
          cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build --parallel 4
          cmake --install build --prefix install

      # The installed library names no folder of this machine, and on Windows a source named with \
      # (as the release build names them) is remapped too (see the script)
      - name: No build paths in the library
        run: |
          case "$RUNNER_OS" in
            Windows) LIB=install/bin/libcppTiff.dll ;;
            macOS)   LIB=install/lib/libcppTiff.dylib ;;
            *)       LIB=install/lib/libcppTiff.so ;;
          esac
          bash .github/scripts/check_build_paths.sh "$PWD" "$LIB" "$PWD/build"

      # The installed library exports none of its static C++ runtime, and still the libtiff and zstd
      # APIs (see the script)
      - name: No C++ runtime in the library's exports
        if: runner.os != 'Windows'
        run: |
          case "$RUNNER_OS" in
            macOS) LIB=install/lib/libcppTiff.dylib ;;
            *)     LIB=install/lib/libcppTiff.so ;;
          esac
          bash .github/scripts/check_exports.sh "$LIB"

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure

      # Compiles the extension straight against the library built above, linked
      # as setup.py links the wheels' (its static C++ runtime kept private to it,
      # and on macOS only its entry point exported), then runs the same test file
      # cibuildwheel runs against the release wheels.
      - name: Python tests
        run: |
          EXT=$(python -c "import sysconfig; print(sysconfig.get_config_var('EXT_SUFFIX'))")
          case "$RUNNER_OS" in
            Linux)
              python -m pip install numpy pybind11
              FLAGS="-fPIC $(python -m pybind11 --includes) -Wl,-rpath,$PWD/install/lib -static-libstdc++ -Wl,--exclude-libs,ALL" ;;
            macOS)
              python -m pip install numpy pybind11
              FLAGS="-fPIC $(python -m pybind11 --includes) -isysroot $(xcrun --show-sdk-path) -undefined dynamic_lookup -Wl,-rpath,$PWD/install/lib -static-libstdc++ -Wl,-exported_symbol,_PyInit_cpptiff" ;;
            Windows)
              PYINC=$(python -c "import sysconfig; print(sysconfig.get_path('include'))")
              PYVER=$(python -c "import sysconfig; print(sysconfig.get_config_var('LDVERSION'))")
              FLAGS="-I$PYINC -lpython$PYVER"
              cp install/bin/libcppTiff.dll python/cpptiff/ ;;
          esac
          "${CXX:-g++}" -O2 -std=c++17 -shared python/cpptiff.cpp -o "python/cpptiff/cpptiff$EXT" \
            -Iinstall/include -Linstall/lib -lcppTiff $FLAGS
          if [ "$RUNNER_OS" = macOS ]; then
            bash .github/scripts/check_exports.sh install/lib/libcppTiff.dylib "python/cpptiff/cpptiff$EXT"
          fi
          PYTHONPATH=python python python/tests/test_python.py

  # The release's Windows toolchain, MinGW-builds GCC 12.2 (UCRT), which emulates thread-local storage, as the MSYS2
  # GCC of the other Windows jobs does not: built with it, the unload test crashed before src/winruntime.cpp
  windows-release-gcc:
    name: C++ (Windows, the release's GCC 12.2)
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # the MinGW-builds project's release (github.com/niXman/mingw-builds-binaries), the toolchain whose name the
      # released DLL carries; the release publishes no digest, so the archive's SHA-256 is pinned here
      - name: Get MinGW-w64 12.2.0 (UCRT)
        run: |
          url=https://github.com/niXman/mingw-builds-binaries/releases/download/12.2.0-rt_v10-rev2/x86_64-12.2.0-release-posix-seh-ucrt-rt_v10-rev2.7z
          curl -sSL --fail -o "$RUNNER_TEMP/mingw.7z" "$url"
          sha=$(sha256sum < "$RUNNER_TEMP/mingw.7z" | cut -d' ' -f1)
          if [ "$sha" != "dc1f299e8450c96f59f4b8f7c1290ebb78ee00ddb71f9ed4ca0efaf5462f8c4e" ]; then
            echo "::error::unexpected MinGW archive $sha"
            exit 1
          fi
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/mingw.7z" > /dev/null
          bin=$(cygpath -m "$RUNNER_TEMP/mingw64/bin")
          echo "$bin" >> "$GITHUB_PATH"
          echo "MINGW_BIN=$bin" >> "$GITHUB_ENV"
          python -m pip install --quiet ninja
          echo "NINJA=$(python -c 'import ninja, os; print(os.path.join(ninja.BIN_DIR, "ninja.exe").replace(chr(92), "/"))')" >> "$GITHUB_ENV"

      - name: Build library and C++ tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_MAKE_PROGRAM="$NINJA" -DCMAKE_C_COMPILER="$MINGW_BIN/gcc.exe" \
            -DCMAKE_CXX_COMPILER="$MINGW_BIN/g++.exe" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build build --parallel 4

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure

  matlab:
    name: MATLAB (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-24.04, shell: bash,        generator: Unix Makefiles }
          - { name: macOS,   os: macos-15,     shell: bash,        generator: Unix Makefiles }
          - { name: Windows, os: windows-2025, shell: 'msys2 {0}', generator: Ninja }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MinGW (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          pacboy: gcc:p libgomp:p cmake:p ninja:p

      # MATLAB finds MinGW through MW_MINGW64_LOC; build_mex.m selects it.
      - name: Point MATLAB at MinGW (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"MW_MINGW64_LOC=${{ steps.msys2.outputs.msys2-location }}\ucrt64" >> $env:GITHUB_ENV'

      - name: Set up GCC 13 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list gcc@13 > /dev/null 2>&1 || brew install gcc@13
          echo "CC=$(brew --prefix gcc@13)/bin/gcc-13" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix gcc@13)/bin/g++-13" >> "$GITHUB_ENV"

      - name: Build library
        run: |
          cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build --parallel 4
          cmake --install build --prefix install

      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          cache: true

      # On macOS, MATLAB crashes while exiting once two OpenMP runtimes are
      # loaded (the library's libgomp and MATLAB's own), after the tests have
      # finished. So the marker file written after the last test decides the
      # result there, not MATLAB's exit code.
      - name: Build mex files and run MATLAB tests
        uses: matlab-actions/run-command@v3
        continue-on-error: ${{ runner.os == 'macOS' }}
        with:
          command: >-
            addpath('.github/scripts', 'tests');
            build_mex(fullfile(pwd, 'install'), fullfile(pwd, 'mex'));
            test_matlab(fullfile(pwd, 'mex'));
            fclose(fopen('matlab-tests-passed', 'w'));

      - name: Check MATLAB tests passed
        shell: bash
        run: test -f matlab-tests-passed || { echo "::error::MATLAB tests did not finish, see the previous step's log"; exit 1; }
